<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>所有商品｜K.Zone 日韓代購</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="navbar">
  <div class="container">
    <a href="index.html" class="nav-icon-btn" aria-label="返回首頁" style="font-size:19px">
      <span class="ico" data-icon="arrow-left" data-size="18"></span>
    </a>
    <div class="logo-wrap">
      <div class="logo-title">所有商品</div>
    </div>
    <a href="cart.html" class="nav-icon-btn" aria-label="購物車">
      <span class="ico" data-icon="shopping-cart" data-size="18"></span>
      <span class="cart-badge" style="display:none">0</span>
    </a>
  </div>
</div>

<div class="src-nav">
  <div class="container" id="srcNavList">
    <button class="sn-item active" data-cat="all">全部</button>
  </div>
</div>

<div style="padding:12px 16px 0; display:none" id="searchQueryWrap">
  <div class="container" style="display:flex; gap:8px; align-items:center">
    <input type="text" id="searchQueryInput" placeholder="輸入商品或款式名稱" style="flex:1; border:0.5px solid var(--c-rose); border-radius:8px; padding:9px 12px; font-size:13px; box-sizing:border-box">
    <button class="btn-secondary" id="searchQueryClearBtn" style="width:auto; padding:9px 14px">清除</button>
  </div>
</div>

<div class="stock-tabs" style="padding-top:14px">
  <div class="container">
    <button class="stab active" data-stock="all"><span class="stab-inner">全部商品</span></button>
    <button class="stab" data-stock="instock"><span class="stab-inner">現貨</span></button>
    <button class="stab" data-stock="preorder"><span class="stab-inner">預購</span></button>
  </div>
</div>

<div class="tag-bar">
  <div class="container" id="tagFilterList"></div>
</div>

<div class="sec-label"><div class="container"><span id="resultCount">商品列表</span><div class="line"></div></div></div>

<div class="product-grid" id="productGrid">
  <div class="loading-wrap" style="grid-column:1/-1"><div class="spin"></div>載入商品中...</div>
</div>

<div style="padding:20px 16px 50px; text-align:center" id="loadMoreWrap">
  <button class="more-btn" id="loadMoreBtn" style="display:none; margin:0 auto">顯示全部商品 <span class="ico" data-icon="chevron-down" data-size="18"></span></button>
</div>

<div class="trademark-notice" style="padding:0 16px 90px">
  MapleStory® and related characters are trademarks of NEXON.<br>
  本站僅販售官方正版商品，相關角色著作權與商標權歸 NEXON 所有。
</div>

<a href="cart.html" class="cart-fab" aria-label="購物車">
  <span class="ico" data-icon="shopping-cart" data-size="18"></span>
  <span class="cart-badge" style="display:none">0</span>
</a>

<script src="firebase-config.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/illustrations.js"></script>
<script src="assets/common.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => renderStaticIcons());</script>
<script>
let allProducts = [];
let categories = [];
let tags = [];
let settings = {};
let currentCatFilter = 'all';
let currentStockFilter = 'all';
let activeTagFilters = new Set();
let displayCount = 24;
let searchQuery = '';

async function init() {
  // 這裡刻意不呼叫 ensureDefaultData()：那是後台第一次啟用時建立預設資料用的，
  // 前台每位訪客都跑一次等於白花 3 次讀取額度（分類/標籤/設定各檢查一次），
  // 而這些資料早就存在了。大連線時這一項就能省下數千次讀取。
  refreshCartBadge();

  // 走快取版本，避免每次換頁都把整組分類/標籤重讀一次（Firestore 免費額度有限）
  const [settingsData, catList, tagList] = await Promise.all([
    getSettings(),
    fetchCategoriesCached(),
    fetchTagsCached()
  ]);
  settings = settingsData;
  categories = catList;
  tags = tagList;

  // 支援從商品詳情頁的分類列點過來（例如 products.html?cat=xxx），一進頁面就先選好該分類
  const urlParams = new URLSearchParams(location.search);
  const catFromUrl = urlParams.get('cat');
  if (catFromUrl) {
    currentCatFilter = catFromUrl;
    // 從分享的分類連結進來時，直接顯示這個分類的「全部」商品，不要只顯示前 24 個。
    // 原因：把分類連結傳給客人，就是希望他看到這個分類的完整內容；
    // 雖然下方有「顯示全部商品」按鈕，但客人多半不會注意到，
    // 會以為這個分類就只有那 24 樣，等於少賣了後面的商品
    displayCount = Infinity;
  }

  // 支援從首頁搜尋框跳過來（products.html?q=xxx），一進頁面就先套用搜尋關鍵字
  const qFromUrl = urlParams.get('q');
  if (qFromUrl) {
    searchQuery = qFromUrl;
    document.getElementById('searchQueryWrap').style.display = 'block';
    document.getElementById('searchQueryInput').value = qFromUrl;
    document.getElementById('resultCount').textContent = `搜尋「${qFromUrl}」的結果`;
    // 搜尋結果同理：客人是帶著明確目標來的，不該讓他以為只有前 24 筆符合
    displayCount = Infinity;
  }
  document.getElementById('searchQueryInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    displayCount = 24;
    filterAndRender();
  });
  document.getElementById('searchQueryClearBtn').addEventListener('click', () => {
    searchQuery = '';
    document.getElementById('searchQueryInput').value = '';
    document.getElementById('searchQueryWrap').style.display = 'none';
    document.getElementById('resultCount').textContent = '商品列表';
    displayCount = 24;
    filterAndRender();
  });

  renderCategoryNav();
  renderTagFilters();
  await loadProducts();

  document.getElementById('loadMoreBtn').addEventListener('click', () => {
    // 點一次就直接顯示該分類/篩選條件下的「全部」商品，不用重複點好幾次
    displayCount = Infinity;
    filterAndRender();
  });
}

function renderCategoryNav() {
  const list = document.getElementById('srcNavList');
  let html = `<button class="sn-item ${currentCatFilter === 'all' ? 'active' : ''}" data-cat="all">全部</button>`;
  html += `<button class="sn-item ${currentCatFilter === 'new' ? 'active' : ''}" data-cat="new">✨ 最新上架</button>`;
  categories.forEach(cat => {
    html += `<button class="sn-item ${currentCatFilter === cat.id ? 'active' : ''}" data-cat="${cat.id}">${escapeHtml(cat.name)}</button>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('.sn-item').forEach(btn => {
    btn.addEventListener('click', () => {
      list.querySelectorAll('.sn-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCatFilter = btn.dataset.cat;
      updateCategoryUrl(currentCatFilter);
      displayCount = 24;
      filterAndRender();
    });
  });
}

// 把目前選的分類同步反映到網址列（不會整頁重新整理），這樣分類頁也有專屬網址可以分享
function updateCategoryUrl(catId) {
  const url = new URL(location.href);
  if (catId === 'all') {
    url.searchParams.delete('cat');
  } else {
    url.searchParams.set('cat', catId);
  }
  history.replaceState(null, '', url.toString());
}

function renderTagFilters() {
  const list = document.getElementById('tagFilterList');
  let html = `<button class="tg active" data-tag="all">全部</button>`;
  tags.forEach(tag => {
    html += `<button class="tg" data-tag="${tag.id}">${escapeHtml(tag.name)}</button>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('.tg').forEach(btn => {
    btn.addEventListener('click', () => {
      const tagId = btn.dataset.tag;
      if (tagId === 'all') {
        activeTagFilters.clear();
        list.querySelectorAll('.tg').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      } else {
        list.querySelector('[data-tag="all"]').classList.remove('active');
        if (activeTagFilters.has(tagId)) {
          activeTagFilters.delete(tagId);
          btn.classList.remove('active');
        } else {
          activeTagFilters.add(tagId);
          btn.classList.add('active');
        }
        if (activeTagFilters.size === 0) {
          list.querySelector('[data-tag="all"]').classList.add('active');
        }
      }
      displayCount = 24;
      filterAndRender();
    });
  });

  document.querySelectorAll('.stab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStockFilter = btn.dataset.stock;
      displayCount = 24;
      filterAndRender();
    });
  });
}

async function loadProducts() {
  try {
    // 走快取版本：連線期間客人會反覆在列表與商品頁之間切換，
    // 每次都重讀全部商品會很快把 Firestore 免費額度用完
    allProducts = await fetchProductsCached();
    filterAndRender();
  } catch (err) {
    console.error(err);
    document.getElementById('productGrid').innerHTML = `<div class="empty-state" style="grid-column:1/-1">${icon('alert-circle', 18)}商品載入失敗</div>`;
  }
}

function filterAndRender() {
  let filtered = currentStockFilter === 'all'
    ? allProducts.slice()
    : allProducts.filter(p => productHasStockType(p, currentStockFilter));

  if (currentCatFilter === 'new') {
    filtered = filterAndSortNewProducts(filtered);
  } else {
    if (currentCatFilter !== 'all') {
      filtered = filtered.filter(p => getProductCategoryIds(p).includes(currentCatFilter));
    }
    filtered = sortBySortOrderSoldOutLast(filtered, currentCatFilter !== 'all' ? currentCatFilter : null);
  }
  if (activeTagFilters.size > 0) filtered = filtered.filter(p => p.tagIds && p.tagIds.some(t => activeTagFilters.has(t)));
  if (searchQuery) filtered = filtered.filter(p => productMatchesSearch(p, searchQuery));

  const grid = document.getElementById('productGrid');
  document.getElementById('resultCount').textContent = searchQuery
    ? `搜尋「${searchQuery}」共 ${filtered.length} 項商品`
    : `共 ${filtered.length} 項商品`;

  const display = filtered.slice(0, displayCount);

  if (display.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">${icon('mood-empty', 18)}目前沒有符合條件的商品</div>`;
    document.getElementById('loadMoreBtn').style.display = 'none';
    return;
  }

  grid.innerHTML = display.map(p => {
    const cat = categories.find(c => getProductCategoryIds(p).includes(c.id));
    return renderProductCard({ ...p, categoryName: cat ? cat.name : '' }, settings.watermarkText);
  }).join('');

  document.getElementById('loadMoreBtn').style.display = filtered.length > displayCount ? 'flex' : 'none';
}

init();
</script>

</body>
</html>
